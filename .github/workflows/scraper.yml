name: LinkedIn Scraper

on:
  workflow_dispatch:
    inputs:
      target_ids:
        description: 'Enter LinkedIn IDs or URLs (e.g. company/tigihr, in/iamrohanpatel)'
        required: true
        default: 'company/tigihr, in/iamrohanpatel'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run Scraper
        env:
          TARGET_INPUT: ${{ github.event.inputs.target_ids }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python scraper.py

      - name: Upload Scraped Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-raw-data
          path: output/
          retention-days: 7
