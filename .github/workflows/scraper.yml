name: LinkedIn Guest Scraper

on:
  workflow_dispatch:
    inputs:
      target_ids:
        description: 'Enter LinkedIn IDs or URLs (separated by comma or newline)'
        required: true
        default: 'satyanadella, company/github, will-smith'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          TARGET_INPUT: ${{ github.event.inputs.target_ids }}
        run: |
          python scraper.py

      - name: Upload Scraped Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-raw-data
          path: output/
          retention-days: 7
